; {{CLIENT}}: its own PHP-FPM pool, running as its own user, so one client's
; app cannot read another's files. Written by scripts/add-client.sh.
[pos-{{CLIENT}}]
user = pos-{{CLIENT}}
group = pos-{{CLIENT}}
listen = /run/php/pos-{{CLIENT}}.sock
listen.owner = caddy
listen.group = caddy
listen.mode = 0660

pm = ondemand
pm.max_children = {{MAX_CHILDREN}}
pm.process_idle_timeout = 30s
pm.max_requests = 500

php_admin_value[open_basedir] = /srv/pos/{{CLIENT}}:/tmp:/usr/share/php
php_admin_value[error_log] = /srv/pos/{{CLIENT}}/shared/storage/logs/php-fpm.log
php_admin_flag[log_errors] = on
php_admin_value[session.save_path] = /srv/pos/{{CLIENT}}/shared/storage/framework/sessions
catch_workers_output = yes
